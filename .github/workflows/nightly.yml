name: nightly

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京 04:00,全量兜底(spec 0014)
  workflow_dispatch:

jobs:
  full-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
