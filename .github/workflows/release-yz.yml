name: release-yz

on:
  push:
    tags: ['yz-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # YPJ-119(spec 0088):发版门禁——单测+进程级冒烟全绿才出 Release(test 依赖 jar 任务,产物即构建)
      - name: Smoke gate - build + unit + process smoke
        run: gradle :cli:test "-PcliVersion=${GITHUB_REF_NAME#yz-v}"
        working-directory: backend
      - name: Create GitHub Release (jar + launch scripts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes backend/cli/build/libs/yz-*.jar backend/script/yz backend/script/yz.cmd
