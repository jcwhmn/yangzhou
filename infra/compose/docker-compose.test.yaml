# YPJ-118(spec 0087):test = E2E/调试实例,仅 api,host 8082,库 yangzhou_test
# 前端不进此文件:E2E 前端由 Playwright webServer 拉起(playwright.config.ts)
# 集成测试不用本文件(Testcontainers 自起一次性容器)
# name 必须三文件互异:同名 project 会互相顶替容器(实测踩坑)
name: yz-test
services:
  api:
    build: ../../backend
    image: yangzhou-api:local
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/yangzhou_test
      YANGZHOU_ATTACHMENT_ENDPOINT: http://host.docker.internal:9000
    ports:
      - "8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
